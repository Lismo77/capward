name: gansey
description: "A free, open-source capsule wardrobe tracker with an optional, bring-your-own-key AI style coach."
publish_to: 'none'
version: 0.7.0+7

environment:
  sdk: ^3.5.0

# Every dependency must be FOSS and must not pull in Google Play Services,
# Firebase or proprietary analytics - F-Droid will reject the app otherwise.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.3.3
  http: ^1.2.2
  sqflite_common_ffi_web: ^1.2.0
  package_info_plus: ^10.2.2
  archive: ^4.6.0
  file_picker: ^13.3.2
  url_launcher: ^6.3.3
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
