# Builds a signed Android APK and attaches it to a GitHub release, so testers
# can install it directly or keep it updated with Obtainium.
#
# Runs when a release is made (called from release.yml). Run it by hand from
# the Actions tab with a tag to attach an APK to an existing release. Tags
# before v0.7.0 predate release signing and would fail the signing check.
#
# Needs repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD
# and ANDROID_KEY_ALIAS (ADR 0011).
name: Android build

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach the APK to
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the APK to (e.g. v0.7.0)
        type: string
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get

      - name: Write the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build
        env:
          ANDROID_REQUIRE_RELEASE_KEY: 'true'
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: flutter build apk --release

      # Belt and braces: never publish a debug-signed APK. Also prints the
      # certificate fingerprint, which is public and lets testers check it.
      - name: Check the signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          certs=$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)
          echo "$certs"
          if echo "$certs" | grep -q "CN=Android Debug"; then
            echo "::error::APK is signed with the debug key"
            exit 1
          fi

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          apk="gansey-$TAG.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release upload "$TAG" "$apk" "$apk.sha256" --clobber

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
