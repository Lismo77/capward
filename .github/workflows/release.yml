# Automatic semantic versioning with release-please.
#
# On every push to main it reads the conventional commits since the last
# release and keeps a "chore(main): release X.Y.Z" pull request up to date.
# That PR bumps pubspec.yaml (version and +build number) and CHANGELOG.md.
# Merging it tags vX.Y.Z, creates a GitHub release, attaches a signed APK
# and deploys the web version; F-Droid builds the tags.
#
# One-time setup: Settings -> Actions -> General -> Workflow permissions ->
# tick "Allow GitHub Actions to create and approve pull requests".
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Releases made with the built-in token don't trigger other workflows, so
  # the Android build and web deploy are called from here.
  android:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/android.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
    permissions:
      contents: write

  web:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/web.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: read
      pages: write
      id-token: write
